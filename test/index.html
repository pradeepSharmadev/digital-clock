<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000f2" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="clock-container">
      <div
        class="clock-display clock-display--smoothed"
        id="clock-display"
        role="timer"
        aria-label="Current time"
      >
        <span class="clock-time" id="clock-time">00:00:00</span>
      </div>

      <time class="clock-date" id="clock-date"></time>

      <label for="clockFont">Clock font</label>
      <select id="clockFont">
        <option value="dseg">DSEG7 Digital</option>
        <option value="mono">Courier New</option>
        <option value="system">System Sans</option>
        <option value="orbitron">Orbitron</option>
      </select>

      <label for="clockSize">Clock size</label>
      <input id="clockSize" type="range" min="32" max="190" value="100" />

      <label for="clockColor">Clock color</label>
      <input id="clockColor" type="color" value="#66b8f0" />
    </main>
  </body>
</html>
